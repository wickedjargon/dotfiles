music_directory "~/d/audio"
playlist_directory "~/.config/mpd/playlists"
db_file "~/.config/mpd/database"
log_file "syslog"
pid_file "~/.config/mpd/pid"
state_file "~/.config/mpd/state"
sticker_file "~/.config/mpd/sticker.sql"

auto_update "yes"
bind_to_address "127.0.0.1"
port "6600"
restore_paused "yes"
max_output_buffer_size "16384"

audio_output {
	type "pulse"
	name "PulseAudio"
}

audio_output {
       type	"fifo"
       name	"Visualizer feed"
       # not /tmp: GTK file choosers hang sniffing FIFOs in browsed dirs;
       # mpd.conf can't expand env vars so XDG_RUNTIME_DIR is spelled out
       path	"/run/user/1000/mpd.fifo"
       format	"44100:16:2"
}
